<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Ledger</title>
  <defs><radialGradient id="bg" cx="0.5" cy="0.35" r="0.8"><stop offset="0" stop-color="#26324F"/><stop offset="1" stop-color="#0E1117"/></radialGradient></defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <svg x="-76.79999999999995" y="-76.79999999999995" width="1177.6" height="1177.6" viewBox="0 0 1024 1024">
  
  <!-- Three cards stacked like a wallet on one centre line, each its own card: the mint card,
       the blue card, and a frosted glass pocket in front holding the rupee
       sign. All three share the same left and right edges. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FEBD2"/>
      <stop offset="1" stop-color="#27A88E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86A6F2"/>
      <stop offset="0.5" stop-color="#4C72B0"/>
      <stop offset="1" stop-color="#2A4687"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#E6EDFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#B7C8F3" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="contact" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glyphShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#132352" flood-opacity="0.5"/>
    </filter>

    <!-- Card shapes, each used for its fill, its contact shadow and the glass. -->
    <rect id="backCard" x="212" y="176" width="600" height="420" rx="132"/>
    <rect id="midCard" x="212" y="300" width="600" height="470" rx="132"/>
    <rect id="glassCard" x="212" y="436" width="600" height="400" rx="132"/>
    <clipPath id="glassClip"><use href="#glassCard"/></clipPath>

    <g id="behindGlass">
      <use href="#backCard" fill="url(#back)"/>
      <use href="#midCard" fill="url(#blue)"/>
    </g>
  </defs>

  <!-- Back card. -->
  <use href="#backCard" fill="url(#back)"/>
  <use href="#backCard" fill="url(#topLight)"/>

  <!-- Blue card, with the shadow it casts on the back card just above its edge. -->
  <use href="#midCard" transform="translate(0 -14)" fill="#0A1230" opacity="0.35" filter="url(#contact)"/>
  <use href="#midCard" fill="url(#blue)"/>
  <use href="#midCard" fill="url(#topLight)"/>

  <!-- Glass pocket: its contact shadow, then the cards behind it blurred
       through a milky pane, then its lit edge. -->
  <use href="#glassCard" transform="translate(0 -14)" fill="#0A1230" opacity="0.30" filter="url(#contact)"/>
  <g clip-path="url(#glassClip)">
    <rect x="150" y="380" width="724" height="500" fill="#F4F7FF" opacity="0.18"/>
    <g filter="url(#frost)"><use href="#behindGlass"/></g>
    <rect x="150" y="380" width="724" height="500" fill="url(#glassFill)"/>
    <rect x="150" y="380" width="724" height="500" fill="url(#sheen)"/>
  </g>
  <use href="#glassCard" fill="none" stroke="url(#glassEdge)" stroke-width="5"/>

  <!-- Rupee sign, drawn as strokes so it is the same on every device. -->
  <g transform="translate(416 518) scale(0.74)" filter="url(#glyphShadow)" fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 24 H236"/>
    <path d="M24 112 H236"/>
    <path d="M24 24 H112 C194 24 216 66 216 112 C216 158 178 190 112 190 H36 L208 308"/>
  </g>
</svg>
</svg>