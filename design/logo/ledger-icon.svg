<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Ledger</title>
  <defs><radialGradient id="bg" cx="0.5" cy="0.35" r="0.8"><stop offset="0" stop-color="#26324F"/><stop offset="1" stop-color="#0E1117"/></radialGradient></defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <svg x="-76.79999999999995" y="-76.79999999999995" width="1177.6" height="1177.6" viewBox="0 0 1024 1024">
  
  <!-- Three layers stacked like cards in a wallet, sharing one rounded
       outline: the warm card at the back, the blue card in the middle,
       and a frosted glass pocket in front holding the rupee sign. -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD891"/>
      <stop offset="1" stop-color="#F0A35E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86A6F2"/>
      <stop offset="0.5" stop-color="#4C72B0"/>
      <stop offset="1" stop-color="#2A4687"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="0.55" stop-color="#E6EDFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9DB4EE" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="lift" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glyphShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#132352" flood-opacity="0.5"/>
    </filter>

    <!-- The shared outline every layer is cut to. -->
    <clipPath id="outline">
      <rect x="212" y="182" width="600" height="640" rx="150"/>
    </clipPath>
    <!-- The glass pocket: its top edge rises slightly to the right. -->
    <clipPath id="pocket">
      <rect x="192" y="452" width="640" height="480" rx="118" transform="rotate(-4 512 692)"/>
    </clipPath>

    <g id="back">
      <rect x="212" y="182" width="600" height="640" fill="url(#warm)"/>
      <!-- The blue card: its top edge falls slightly to the right. -->
      <rect x="192" y="316" width="640" height="400" rx="122" fill="url(#blue)" transform="rotate(3.5 512 516)"/>
    </g>
  </defs>

  <g clip-path="url(#outline)">
    <use href="#back"/>
    <!-- A soft shadow above the pocket's edge lifts it off the blue card. -->
    <rect x="192" y="440" width="640" height="480" rx="118" transform="rotate(-4 512 680)" fill="#0B1633" opacity="0.22" filter="url(#lift)"/>
    <!-- Frosted glass: the cards behind, blurred, through a milky pane. -->
    <g clip-path="url(#pocket)">
      <rect x="212" y="182" width="600" height="640" fill="#F4F7FF" opacity="0.30"/>
      <g filter="url(#frost)"><use href="#back"/></g>
      <rect x="192" y="420" width="640" height="420" fill="url(#glassFill)"/>
      <rect x="192" y="420" width="640" height="420" fill="url(#sheen)"/>
    </g>
    <!-- The pocket's top edge, catching the light. -->
    <rect x="192" y="452" width="640" height="480" rx="118" transform="rotate(-4 512 692)" fill="none" stroke="url(#glassEdge)" stroke-width="7"/>
  </g>
  <!-- The outline's lower edge where it bounds the glass. -->
  <g clip-path="url(#pocket)">
    <rect x="215" y="185" width="594" height="634" rx="147" fill="none" stroke="url(#glassEdge)" stroke-width="5"/>
  </g>

  <!-- Rupee sign, drawn as strokes so it is the same on every device. -->
  <g transform="translate(416 520) scale(0.74)" filter="url(#glyphShadow)" fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 24 H236"/>
    <path d="M24 112 H236"/>
    <path d="M24 24 H112 C194 24 216 66 216 112 C216 158 178 190 112 190 H36 L208 308"/>
  </g>
</svg>
</svg>